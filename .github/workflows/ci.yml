name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-cs-fixer:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: php-cs-fixer

      - name: Run PHP CS Fixer
        run: php-cs-fixer fix --dry-run --diff

  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Run Composer Audit
        run: composer audit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dependency-versions: ['highest', 'lowest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          dependency-versions: ${{ matrix.dependency-versions }}

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
        symfony-version: ['^5.4', '^6.4', '^7.0', '8.0.*', '8.1.*', '8.2.*@beta']
        exclude:
          # Symfony 7 requires PHP >= 8.2
          - php-version: '8.1'
            symfony-version: '^7.0'
          # Symfony 8 requires PHP >= 8.4
          - php-version: '8.1'
            symfony-version: '8.0.*'
          - php-version: '8.1'
            symfony-version: '8.1.*'
          - php-version: '8.1'
            symfony-version: '8.2.*@beta'
          - php-version: '8.2'
            symfony-version: '8.0.*'
          - php-version: '8.2'
            symfony-version: '8.1.*'
          - php-version: '8.2'
            symfony-version: '8.2.*@beta'
          - php-version: '8.3'
            symfony-version: '8.0.*'
          - php-version: '8.3'
            symfony-version: '8.1.*'
          - php-version: '8.3'
            symfony-version: '8.2.*@beta'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Require Symfony version
        # --no-security-blocking: EOL branches like Symfony 8.0 only have versions
        # flagged by security advisories; we still want to test compatibility.
        run: composer require symfony/http-foundation:${{ matrix.symfony-version }} -W --no-interaction --no-security-blocking

      - name: Run PHPUnit
        run: vendor/bin/phpunit --coverage-text
